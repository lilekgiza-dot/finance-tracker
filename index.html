<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --accent:         #1baf7a;
    --accent-tint:    rgba(27,175,122,0.10);
    --group-head:     #f2f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;
      --critical:       #e66767;
      --accent:         #199e70;
      --accent-tint:    rgba(25,158,112,0.16);
      --group-head:     #232320;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }

  .top-row {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  .top-row h1 { font-size: 20px; margin: 0; }
  .balance-chip {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px; font-size: 14px;
  }
  .balance-chip b { font-variant-numeric: tabular-nums; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

  table.budget { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 480px; }
  table.budget th { text-align: right; color: var(--text-secondary); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--gridline); }
  table.budget th:first-child { text-align: left; }
  table.budget td { padding: 6px 8px; border-bottom: 1px solid var(--gridline); text-align: right; font-variant-numeric: tabular-nums; }
  table.budget td:first-child { text-align: left; font-variant-numeric: normal; }
  table.budget tr.group-head td { background: var(--group-head); font-weight: 700; }
  table.budget tr.subtotal td { font-weight: 700; border-top: 1px solid var(--muted); }
  table.budget tr.grand td { font-weight: 700; background: var(--accent-tint); color: var(--accent); }
  table.budget td.dev-pos { color: var(--good); }
  table.budget td.dev-neg { color: var(--critical); }
  table.budget td.muted { color: var(--muted); }

  table.daily { border-collapse: collapse; font-size: 12px; min-width: 900px; }
  table.daily th, table.daily td { padding: 4px 6px; border: 1px solid var(--gridline); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.daily th:first-child, table.daily td:first-child {
    text-align: left; position: sticky; left: 0; background: var(--surface-1);
    min-width: 170px; font-variant-numeric: normal;
  }
  table.daily tr.group-head td { background: var(--group-head); font-weight: 700; }
  table.daily td.zero { color: var(--muted); }

  .ops-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--gridline); font-size: 13px;
  }
  .ops-row:last-child { border-bottom: none; }
  .ops-date { color: var(--muted); width: 70px; flex: none; }
  .ops-cat { flex: 1; min-width: 0; }
  .ops-note { color: var(--muted); font-size: 12px; }
  .ops-amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .ops-amt.income { color: var(--good); }

  .placeholder { text-align: center; color: var(--text-secondary); padding: 40px 16px; }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="placeholder" id="placeholder">Загружаю данные…</div>
  </div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function money(n) {
    if (n === null || n === undefined) return "—";
    var sign = n < 0 ? "-" : "";
    return sign + Math.round(Math.abs(n)).toLocaleString("ru-RU") + " ₽";
  }
  function devClass(dev) {
    if (dev === null) return "muted";
    return dev >= 0 ? "dev-pos" : "dev-neg";
  }

  function computeFacts(data) {
    var facts = {};
    var all = [];
    ["mandatory", "optional"].forEach(function (g) {
      data.categories[g].forEach(function (c) { all.push(c.name); });
    });
    data.categories.income.forEach(function (c) { all.push(c.name); });
    data.categories.savings.forEach(function (c) { all.push(c.name); });
    all.forEach(function (name) { facts[name] = 0; });
    data.operations.forEach(function (op) {
      facts[op.category] = (facts[op.category] || 0) + op.amount;
    });
    return facts;
  }

  function renderBudgetTable(data, facts) {
    var rows = [];
    function catRow(c) {
      var fact = facts[c.name] || 0;
      var plan = c.plan;
      var dev = plan == null ? null : (plan - fact);
      rows.push(
        '<tr><td>' + c.name + '</td>' +
        '<td class="muted">' + money(plan) + '</td>' +
        '<td>' + money(fact) + '</td>' +
        '<td class="' + devClass(dev) + '">' + (dev === null ? "—" : money(dev)) + '</td></tr>'
      );
      return fact;
    }

    rows.push('<tr><th>Категория</th><th>План</th><th>Факт</th><th>Отклонение</th></tr>');

    rows.push('<tr class="group-head"><td colspan="4">ДОХОДЫ</td></tr>');
    var incomeTotal = 0;
    data.categories.income.forEach(function (c) { incomeTotal += catRow(c); });
    rows.push('<tr class="subtotal"><td>ИТОГО ДОХОДЫ</td><td></td><td>' + money(incomeTotal) + '</td><td></td></tr>');

    rows.push('<tr class="group-head"><td colspan="4">РАСХОДЫ — Обязательные</td></tr>');
    var mandTotal = 0;
    data.categories.mandatory.forEach(function (c) { mandTotal += catRow(c); });

    rows.push('<tr class="group-head"><td colspan="4">РАСХОДЫ — Необязательные</td></tr>');
    var optTotal = 0;
    data.categories.optional.forEach(function (c) { optTotal += catRow(c); });

    var expenseTotal = mandTotal + optTotal;
    rows.push('<tr class="subtotal"><td>ИТОГО РАСХОДЫ</td><td></td><td>' + money(expenseTotal) + '</td><td></td></tr>');

    rows.push('<tr class="group-head"><td colspan="4">НАКОПЛЕНИЯ</td></tr>');
    var auto10 = Math.round(incomeTotal * 0.10 * 100) / 100;
    rows.push('<tr><td>10% от поступлений (авто)</td><td class="muted">—</td><td>' + money(auto10) + '</td><td class="muted">—</td></tr>');
    var savingsTotal = auto10;
    data.categories.savings.forEach(function (c) { savingsTotal += catRow(c); });
    rows.push('<tr class="subtotal"><td>ИТОГО НАКОПЛЕНИЯ</td><td></td><td>' + money(savingsTotal) + '</td><td></td></tr>');

    rows.push('<tr class="subtotal"><td>ИТОГО РАСХОДЫ + НАКОПЛЕНИЯ</td><td></td><td>' + money(expenseTotal + savingsTotal) + '</td><td></td></tr>');

    var net = incomeTotal - expenseTotal - savingsTotal;
    rows.push('<tr class="grand"><td>ЭКОНОМИЯ / ПЕРЕРАСХОД</td><td></td><td>' + money(net) + '</td><td></td></tr>');

    return '<table class="budget">' + rows.join("") + '</table>';
  }

  function renderDailyTable(data) {
    var days = data.days_in_month;
    var monthStart = new Date(data.month_start + "T00:00:00");
    var dayTotals = {};
    for (var d = 1; d <= days; d++) dayTotals[d] = {};

    data.operations.forEach(function (op) {
      var opDate = new Date(op.date + "T00:00:00");
      var day = opDate.getDate();
      if (opDate.getMonth() !== monthStart.getMonth()) return;
      dayTotals[day][op.category] = (dayTotals[day][op.category] || 0) + op.amount;
    });

    function headerRow() {
      var cells = ['<th>Категория</th>'];
      for (var d = 1; d <= days; d++) cells.push('<th>' + d + '</th>');
      return '<tr>' + cells.join("") + '</tr>';
    }
    function catRow(name) {
      var cells = ['<td>' + name + '</td>'];
      for (var d = 1; d <= days; d++) {
        var v = dayTotals[d][name];
        cells.push(v ? '<td>' + money(v) + '</td>' : '<td class="zero">·</td>');
      }
      return '<tr>' + cells.join("") + '</tr>';
    }
    function groupHead(label) {
      return '<tr class="group-head"><td colspan="' + (days + 1) + '">' + label + '</td></tr>';
    }

    var rows = [headerRow()];
    rows.push(groupHead("ДОХОДЫ"));
    data.categories.income.forEach(function (c) { rows.push(catRow(c.name)); });
    rows.push(groupHead("ОБЯЗАТЕЛЬНЫЕ"));
    data.categories.mandatory.forEach(function (c) { rows.push(catRow(c.name)); });
    rows.push(groupHead("НЕОБЯЗАТЕЛЬНЫЕ"));
    data.categories.optional.forEach(function (c) { rows.push(catRow(c.name)); });
    rows.push(groupHead("НАКОПЛЕНИЯ"));
    data.categories.savings.forEach(function (c) { rows.push(catRow(c.name)); });

    return '<table class="daily">' + rows.join("") + '</table>';
  }

  function renderOps(data) {
    var sorted = data.operations.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    return sorted.map(function (op) {
      var isIncome = op.type === "income";
      var amtClass = isIncome ? "ops-amt income" : "ops-amt";
      var amtText = (isIncome ? "+" : "-") + money(Math.abs(op.amount)).replace("-", "");
      var dateShort = op.date.slice(8, 10) + "." + op.date.slice(5, 7);
      return (
        '<div class="ops-row">' +
          '<span class="ops-date">' + dateShort + '</span>' +
          '<span class="ops-cat">' + op.category + (op.note ? '<div class="ops-note">' + op.note + '</div>' : '') + '</span>' +
          '<span class="' + amtClass + '">' + amtText + '</span>' +
        '</div>'
      );
    }).join("");
  }

  function render(data) {
    var facts = computeFacts(data);
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="top-row">' +
        '<h1>' + data.month_label + '</h1>' +
        '<span class="balance-chip">' + (data.balance_label || "Баланс") + ': <b>' + money(data.balance) + '</b></span>' +
      '</div>' +
      '<div class="card"><h2>Бюджет месяца</h2>' + renderBudgetTable(data, facts) + '</div>' +
      '<div class="card"><h2>По дням месяца</h2>' + renderDailyTable(data) + '</div>' +
      '<div class="card"><h2>Операции (на что потрачено)</h2>' + renderOps(data) + '</div>' +
      '<div class="placeholder" style="padding:8px 0;font-size:12px;">Обновлено: ' +
        new Date(data.updated_at).toLocaleString("ru-RU", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) +
      '</div>';
  }

  function showError() {
    document.getElementById("app").innerHTML = '<div class="placeholder">Не получилось загрузить данные.<br>Открой чуть позже.</div>';
  }

  fetch("data.json?v=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
    .then(render)
    .catch(showError);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --surface-1:      #fcfcfb;
    --page:           #f4f3ef;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.08);
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --good-tint:      rgba(12,163,12,0.10);
    --critical-tint:  rgba(208,59,59,0.10);
    --accent:         #1baf7a;
    --accent-tint:    rgba(27,175,122,0.12);
    --series-1: #2a78d6; --series-2: #1baf7a; --series-3: #eda100; --series-4: #008300;
    --series-5: #4a3aa7; --series-6: #e34948; --series-other: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1:      #201f1d;
      --page:           #121211;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --gridline:       #34332f;
      --border:         rgba(255,255,255,0.09);
      --good:           #0ca30c;
      --critical:       #e66767;
      --good-tint:      rgba(12,163,12,0.16);
      --critical-tint:  rgba(230,103,103,0.16);
      --accent:         #199e70;
      --accent-tint:    rgba(25,158,112,0.18);
      --series-1: #3987e5; --series-2: #199e70; --series-3: #c98500; --series-4: #008300;
      --series-5: #9085e9; --series-6: #e66767; --series-other: #3f3e3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.03em; }

  .hero { text-align: center; padding: 26px 18px; }
  .hero .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .hero .value { font-size: 42px; font-weight: 700; letter-spacing: -0.02em; }
  .hero-split { display: flex; justify-content: center; gap: 28px; margin-top: 16px; }
  .hero-split .item { text-align: center; }
  .hero-split .lbl { font-size: 12px; color: var(--muted); }
  .hero-split .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero-split .val.income { color: var(--good); }
  .hero-split .val.expense { color: var(--critical); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat-card { background: var(--page); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
  .stat-card:active { opacity: 0.7; }
  .stat-card .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .stat-card .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-card .val.amber { color: #c98500; }
  .stat-card .val.good { color: var(--good); }
  .stat-card .val.income { color: var(--good); }
  .stat-card .val.expense { color: var(--critical); }

  .period-bar { text-align: center; font-size: 13px; color: var(--text-secondary); margin: 14px 0 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .period-bar button { border: none; background: none; font-size: 16px; color: var(--muted); cursor: pointer; padding: 2px 6px; }
  .period-tabs { display: flex; background: var(--page); border-radius: 12px; padding: 3px; gap: 3px; }
  .period-tabs .tab { flex: 1; text-align: center; padding: 8px 0; border-radius: 9px; font-size: 13px; cursor: pointer; color: var(--text-secondary); }
  .period-tabs .tab.active { background: var(--accent-tint); color: var(--accent); font-weight: 600; }

  .cat-list-row { border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; background: var(--page); cursor: pointer; }
  .cat-list-row .head { display: flex; align-items: center; gap: 10px; }
  .cat-list-row .head .icon { font-size: 18px; }
  .cat-list-row .head .name { flex: 1; font-size: 14px; font-weight: 600; }
  .cat-list-row .head .amt { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--critical); }
  .cat-list-row .detail { max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
  .cat-list-row.open .detail { max-height: 300px; margin-top: 8px; }
  .cat-list-row .detail-row { font-size: 12px; color: var(--muted); padding: 3px 0; border-top: 1px solid var(--gridline); }
  .bill-sub { font-size: 12px; color: var(--muted); margin-top: 4px; padding-left: 28px; font-variant-numeric: tabular-nums; }
  .cat-hint { text-align: right; font-size: 11px; color: var(--muted); margin: -6px 0 8px; }

  .bottom-nav { display: flex; background: var(--page); border-radius: 14px; padding: 4px; gap: 2px; margin-top: 4px; }
  .bottom-nav .tab { flex: 1; text-align: center; padding: 8px 2px; border-radius: 11px; font-size: 11px; color: var(--muted); }
  .bottom-nav .tab.active { background: var(--accent-tint); color: var(--accent); font-weight: 600; }

  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .donut-legend { flex: 1; min-width: 180px; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend-name { flex: 1; }
  .legend-pct { color: var(--muted); font-size: 12px; width: 34px; text-align: right; }
  .legend-amt { font-variant-numeric: tabular-nums; font-weight: 600; width: 70px; text-align: right; }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-card {
    background: var(--page); border-radius: 14px; padding: 12px;
  }
  .cat-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cat-card .icon { font-size: 18px; }
  .cat-card .amt { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  .cat-card .name { font-size: 12px; color: var(--text-secondary); }
  .cat-card .bar-track { height: 5px; background: var(--gridline); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .cat-card .bar-fill { height: 100%; border-radius: 3px; }

  .acct-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .acct-card { background: var(--page); border-radius: 14px; padding: 10px 14px; flex: 1; min-width: 110px; text-align: center; }
  .acct-card .icon { font-size: 18px; }
  .acct-card .name { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .acct-card .amt { font-weight: 700; font-variant-numeric: tabular-nums; }

  .ops-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--gridline); font-size: 13px;
  }
  .ops-row:last-child { border-bottom: none; }
  .ops-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ops-date { color: var(--muted); width: 40px; flex: none; font-size: 12px; }
  .ops-cat { flex: 1; min-width: 0; }
  .ops-note { color: var(--muted); font-size: 12px; }
  .ops-amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .ops-amt.income { color: var(--good); }

  .annual-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--gridline); font-size: 13px; }
  .annual-row:last-child { border-bottom: none; }
  .annual-row .m { color: var(--text-secondary); }
  .annual-row .s.good { color: var(--good); font-weight: 600; }
  .annual-row .s.bad { color: var(--critical); font-weight: 600; }
  .annual-row .s.muted { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }
  .placeholder { text-align: center; color: var(--text-secondary); padding: 40px 16px; }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="placeholder" id="placeholder">Загружаю данные…</div>
  </div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function money(n) {
    if (n === null || n === undefined) return "—";
    var sign = n < 0 ? "-" : "";
    return sign + Math.round(Math.abs(n)).toLocaleString("ru-RU") + " ₽";
  }

  var CAT_ICONS = {
    "Пенсия": "🏦", "Премии": "🎁", "Доп доход": "💵", "Другие источники": "➕",
    "Коммунальные платежи": "🏠", "Сотовая связь+Интернет": "📶", "Продукты питания": "🛒",
    "Пром.товары": "🧴", "Транспорт": "🚌", "Здоровье + Красота": "💊",
    "Образование": "📚", "Развлечения, подарки": "🎬", "Одежда/Обувь": "👗", "Крупные покупки": "🛋️",
    "Дом, сад и огород": "🌱", "Непредвиденные затраты": "⚠️",
    "Инвестиции": "📈", "Отпуск": "✈️"
  };
  var ACCOUNT_ICONS = { "Халва": "💜", "Т-банк": "💛", "Наличные": "💵", "Сбер": "💚", "Мир": "💳" };
  var SERIES = ["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)","var(--series-5)","var(--series-6)"];
  var MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

  function computeFacts(data) {
    var facts = {};
    data.operations.forEach(function (op) {
      facts[op.category] = (facts[op.category] || 0) + op.amount;
    });
    return facts;
  }

  function allExpenseCategories(data) {
    return data.categories.mandatory.concat(data.categories.optional);
  }

  function computeTotals(data, facts) {
    var incomeTotal = 0;
    data.categories.income.forEach(function (c) { incomeTotal += facts[c.name] || 0; });
    var expenseTotal = 0;
    allExpenseCategories(data).forEach(function (c) { expenseTotal += facts[c.name] || 0; });
    var savingsTotal = Math.round(incomeTotal * 0.10 * 100) / 100;
    data.categories.savings.forEach(function (c) { savingsTotal += facts[c.name] || 0; });
    return { incomeTotal: incomeTotal, expenseTotal: expenseTotal, savingsTotal: savingsTotal, net: incomeTotal - expenseTotal - savingsTotal };
  }

  function renderHero(data, totals) {
    var bills = data.bills || [];
    var billsUnpaid = bills.filter(function (b) { return !b.paid; }).reduce(function (s, b) { return s + b.amount; }, 0);
    var freeLeft = data.balance - billsUnpaid;
    return (
      '<div class="card hero" style="text-align:left;padding:18px;">' +
        '<div class="label" style="text-align:center;">' + (data.balance_label || "Баланс") + '</div>' +
        '<div class="value" style="text-align:center;">' + money(data.balance) + '</div>' +
        '<div class="stat-grid">' +
          '<div class="stat-card" onclick="switchView(\'bills\')"><div class="lbl">Обязательные к оплате</div><div class="val amber">' + money(billsUnpaid) + '</div></div>' +
          '<div class="stat-card" onclick="switchView(\'settings\')"><div class="lbl">Свободный остаток</div><div class="val good">' + money(freeLeft) + '</div></div>' +
          '<div class="stat-card" onclick="switchView(\'ops\')"><div class="lbl">Доходы</div><div class="val income">+' + money(totals.incomeTotal) + '</div></div>' +
          '<div class="stat-card" onclick="switchView(\'ops\')"><div class="lbl">Расходы</div><div class="val expense">-' + money(totals.expenseTotal) + '</div></div>' +
        '</div>' +
        renderPeriodBar(data) +
      '</div>'
    );
  }

  function renderPeriodBar(data) {
    var start = new Date(data.month_start + "T00:00:00");
    var end = new Date(start.getFullYear(), start.getMonth() + 1, start.getDate() - 1);
    function fmt(d) { return d.getDate() + " " + MONTH_GEN[d.getMonth()]; }
    return (
      '<div class="period-bar">' +
        '<button disabled>‹</button>' +
        '<span>Фин. период: ' + fmt(start) + ' – ' + fmt(end) + ' ' + end.getFullYear() + ' г.</span>' +
        '<button disabled>›</button>' +
      '</div>' +
      '<div class="period-tabs">' +
        '<div class="tab" onclick="switchPeriodTab(this)">День</div><div class="tab" onclick="switchPeriodTab(this)">Неделя</div>' +
        '<div class="tab active" onclick="switchPeriodTab(this)">Месяц</div><div class="tab" onclick="switchPeriodTab(this)">Год</div>' +
      '</div>'
    );
  }

  var MONTH_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

  function renderCategoryList(data, facts) {
    var all = allExpenseCategories(data).map(function (c) { return { name: c.name, amount: facts[c.name] || 0 }; });
    var withSpend = all.filter(function (c) { return c.amount > 0; }).sort(function (a, b) { return b.amount - a.amount; });
    var rest = all.filter(function (c) { return c.amount === 0; });
    var ordered = withSpend.concat(rest);

    var rows = ordered.map(function (c, idx) {
      var ops = data.operations.filter(function (o) { return o.category === c.name; })
        .sort(function (a, b) { return b.date.localeCompare(a.date); });
      var detail = ops.length
        ? ops.map(function (o) {
            var d = o.date.slice(8, 10) + "." + o.date.slice(5, 7);
            return '<div class="detail-row">' + d + ' — ' + money(o.amount) + (o.note ? " · " + o.note : "") + (o.account ? " · " + o.account : "") + '</div>';
          }).join("")
        : '<div class="detail-row">Пока нет операций</div>';
      return (
        '<div class="cat-list-row" data-idx="' + idx + '" onclick="this.classList.toggle(\'open\')">' +
          '<div class="head">' +
            '<span class="icon">' + (CAT_ICONS[c.name] || "") + '</span>' +
            '<span class="name">' + c.name + '</span>' +
            '<span class="amt">' + (c.amount ? "-" + money(c.amount) : money(0)) + '</span>' +
          '</div>' +
          '<div class="detail">' + detail + '</div>' +
        '</div>'
      );
    }).join("");

    return '<div class="card"><h2>Категории</h2><div class="cat-hint">Нажми, чтобы открыть</div>' + rows + '</div>';
  }

  var VIEW_KEYS = ["home", "ops", "bills", "notes", "settings"];
  var VIEW_LABELS = ["Главная", "Операции", "Оплаты", "Заметки", "Настройки"];

  function renderBottomNav() {
    return '<div class="bottom-nav">' + VIEW_LABELS.map(function (t, i) {
      return '<div class="tab' + (i === 0 ? ' active' : '') + '" onclick="switchView(\'' + VIEW_KEYS[i] + '\')">' + t + '</div>';
    }).join("") + '</div>';
  }

  function renderBillsView(data) {
    var bills = data.bills || [];
    var paidSum = bills.reduce(function (s, b) { return s + (b.actual || 0); }, 0);
    var planSum = bills.reduce(function (s, b) { return s + b.amount; }, 0);
    var list = bills.length
      ? bills.map(function (b) {
          var actual = b.actual || 0;
          var dev = b.amount - actual;
          var devColor = dev >= 0 ? "var(--good)" : "var(--critical)";
          var devText = (dev >= 0 ? "+" : "-") + money(Math.abs(dev));
          var icon = b.is_bill ? (b.paid ? "✅" : "🔲") : "📊";
          return '<div class="cat-list-row" style="cursor:default;"><div class="head">' +
            '<span class="icon">' + icon + '</span>' +
            '<span class="name">' + b.name + '</span>' +
            '<span class="amt" style="color:var(--text-secondary)">План ' + money(b.amount) + '</span>' +
            '</div>' +
            '<div class="bill-sub">Факт: ' + money(actual) + ' &nbsp;·&nbsp; Отклонение: <span style="color:' + devColor + '">' + devText + '</span></div>' +
            '</div>';
        }).join("")
      : '<div class="empty">Обязательных трат в этом месяце пока нет</div>';
    return (
      '<div class="card"><h2>Обязательные траты</h2>' +
        '<div class="stat-grid" style="margin-top:0;">' +
          '<div class="stat-card"><div class="lbl">План на месяц</div><div class="val">' + money(planSum) + '</div></div>' +
          '<div class="stat-card"><div class="lbl">Оплачено факт</div><div class="val good">' + money(paidSum) + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card"><h2>Список</h2>' + list + '</div>' +
      '<div class="empty">Добавить платёж можно, просто напиши мне сумму и на что</div>'
    );
  }

  function renderAccounts(data) {
    var accts = data.accounts || [];
    if (!accts.length) return "";
    var cards = accts.map(function (a) {
      return (
        '<div class="acct-card">' +
          '<div class="icon">' + (ACCOUNT_ICONS[a.name] || "💳") + '</div>' +
          '<div class="amt">' + money(a.amount) + '</div>' +
          '<div class="name">' + a.name + '</div>' +
        '</div>'
      );
    }).join("");
    return '<div class="card"><h2>По картам и счетам</h2><div class="acct-row">' + cards + '</div></div>';
  }

  function renderOps(data) {
    if (!data.operations.length) return '<div class="card"><h2>Операции</h2><div class="empty">Пока нет записей</div></div>';
    var sorted = data.operations.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var rows = sorted.map(function (op) {
      var isIncome = op.type === "income";
      var amtClass = isIncome ? "ops-amt income" : "ops-amt";
      var amtText = (isIncome ? "+" : "-") + money(op.amount);
      var dateShort = op.date.slice(8, 10) + "." + op.date.slice(5, 7);
      var noteLine = [op.note, op.account].filter(Boolean).join(" · ");
      var color = isIncome ? "var(--good)" : "var(--series-other)";
      return (
        '<div class="ops-row">' +
          '<span class="ops-dot" style="background:' + color + '"></span>' +
          '<span class="ops-date">' + dateShort + '</span>' +
          '<span class="ops-cat">' + (CAT_ICONS[op.category] || "") + ' ' + op.category + (noteLine ? '<div class="ops-note">' + noteLine + '</div>' : '') + '</span>' +
          '<span class="' + amtClass + '">' + amtText + '</span>' +
        '</div>'
      );
    }).join("");
    return '<div class="card"><h2>Операции</h2>' + rows + '</div>';
  }

  function renderAnnual(data, totals) {
    var report = data.annual_report || { current_month_index: new Date().getMonth(), archive: [] };
    var archiveByIndex = {};
    (report.archive || []).forEach(function (m) { archiveByIndex[m.index] = m; });
    var rows = [];
    for (var i = 0; i < 12; i++) {
      var label = MONTH_NAMES[i];
      var income, expense, isCurrent = (i === report.current_month_index);
      if (isCurrent) { income = totals.incomeTotal; expense = totals.expenseTotal; }
      else if (archiveByIndex[i]) { income = archiveByIndex[i].income; expense = archiveByIndex[i].expense; }
      else { rows.push('<div class="annual-row"><span class="m">' + label + '</span><span class="s muted">—</span></div>'); continue; }
      var saldo = income - expense;
      rows.push(
        '<div class="annual-row"><span class="m">' + label + (isCurrent ? " (тек.)" : "") + '</span>' +
        '<span class="s ' + (saldo >= 0 ? "good" : "bad") + '">' + money(saldo) + '</span></div>'
      );
    }
    return '<div class="card"><h2>Годовой отчёт</h2>' + rows.join("") + '</div>';
  }

  function render(data) {
    var facts = computeFacts(data);
    var totals = computeTotals(data, facts);
    var app = document.getElementById("app");

    var views = {
      home: renderHero(data, totals) + renderCategoryList(data, facts),
      ops: renderOps(data),
      bills: renderBillsView(data),
      notes: '<div class="card"><h2>Заметки</h2><div class="empty">Скоро — раздел ещё не готов</div></div>',
      settings: renderAccounts(data) + renderAnnual(data, totals)
    };

    var viewsHtml = VIEW_KEYS.map(function (k) {
      return '<div class="view" id="view-' + k + '" style="display:' + (k === "home" ? "block" : "none") + '">' + views[k] + '</div>';
    }).join("");

    app.innerHTML =
      '<h1 style="font-size:20px;margin:4px 0 2px;">Касса</h1>' +
      '<div class="empty" style="text-align:left;padding:0 0 12px;">Финансовый месяц</div>' +
      viewsHtml +
      renderBottomNav() +
      '<div class="empty">Обновлено: ' + new Date(data.updated_at).toLocaleString("ru-RU", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) + '</div>';
  }

  window.switchView = function (key) {
    VIEW_KEYS.forEach(function (k) {
      var el = document.getElementById("view-" + k);
      if (el) el.style.display = (k === key) ? "block" : "none";
    });
    document.querySelectorAll(".bottom-nav .tab").forEach(function (t, i) {
      t.classList.toggle("active", VIEW_KEYS[i] === key);
    });
  };

  window.switchPeriodTab = function (el) {
    var row = el.parentElement;
    row.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
    el.classList.add("active");
    if (el.textContent !== "Месяц") {
      el.insertAdjacentHTML("afterend", "");
      alert("Переключение по " + el.textContent.toLowerCase() + " пока не считает данные — это следующий шаг. Сейчас показан текущий месяц.");
    }
  };

  function showError() {
    document.getElementById("app").innerHTML = '<div class="placeholder">Не получилось загрузить данные.<br>Открой чуть позже.</div>';
  }

  fetch("data.json?v=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
    .then(render)
    .catch(showError);
})();
</script>
</body>
</html>

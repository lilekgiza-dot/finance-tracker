<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --surface-1:      #fcfcfb;
    --page:           #f4f3ef;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.08);
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --good-tint:      rgba(12,163,12,0.10);
    --critical-tint:  rgba(208,59,59,0.10);
    --accent:         #1baf7a;
    --accent-tint:    rgba(27,175,122,0.12);
    --series-1: #2a78d6; --series-2: #1baf7a; --series-3: #eda100; --series-4: #008300;
    --series-5: #4a3aa7; --series-6: #e34948; --series-other: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1:      #201f1d;
      --page:           #121211;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --gridline:       #34332f;
      --border:         rgba(255,255,255,0.09);
      --good:           #0ca30c;
      --critical:       #e66767;
      --good-tint:      rgba(12,163,12,0.16);
      --critical-tint:  rgba(230,103,103,0.16);
      --accent:         #199e70;
      --accent-tint:    rgba(25,158,112,0.18);
      --series-1: #3987e5; --series-2: #199e70; --series-3: #c98500; --series-4: #008300;
      --series-5: #9085e9; --series-6: #e66767; --series-other: #3f3e3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.03em; }

  .hero { text-align: center; padding: 26px 18px; }
  .hero .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .hero .value { font-size: 42px; font-weight: 700; letter-spacing: -0.02em; }
  .hero-split { display: flex; justify-content: center; gap: 28px; margin-top: 16px; }
  .hero-split .item { text-align: center; }
  .hero-split .lbl { font-size: 12px; color: var(--muted); }
  .hero-split .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero-split .val.income { color: var(--good); }
  .hero-split .val.expense { color: var(--critical); }

  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .donut-legend { flex: 1; min-width: 180px; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend-name { flex: 1; }
  .legend-pct { color: var(--muted); font-size: 12px; width: 34px; text-align: right; }
  .legend-amt { font-variant-numeric: tabular-nums; font-weight: 600; width: 70px; text-align: right; }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-card {
    background: var(--page); border-radius: 14px; padding: 12px;
  }
  .cat-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cat-card .icon { font-size: 18px; }
  .cat-card .amt { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  .cat-card .name { font-size: 12px; color: var(--text-secondary); }
  .cat-card .bar-track { height: 5px; background: var(--gridline); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .cat-card .bar-fill { height: 100%; border-radius: 3px; }

  .acct-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .acct-card { background: var(--page); border-radius: 14px; padding: 10px 14px; flex: 1; min-width: 110px; text-align: center; }
  .acct-card .icon { font-size: 18px; }
  .acct-card .name { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .acct-card .amt { font-weight: 700; font-variant-numeric: tabular-nums; }

  .ops-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--gridline); font-size: 13px;
  }
  .ops-row:last-child { border-bottom: none; }
  .ops-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ops-date { color: var(--muted); width: 40px; flex: none; font-size: 12px; }
  .ops-cat { flex: 1; min-width: 0; }
  .ops-note { color: var(--muted); font-size: 12px; }
  .ops-amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .ops-amt.income { color: var(--good); }

  .annual-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--gridline); font-size: 13px; }
  .annual-row:last-child { border-bottom: none; }
  .annual-row .m { color: var(--text-secondary); }
  .annual-row .s.good { color: var(--good); font-weight: 600; }
  .annual-row .s.bad { color: var(--critical); font-weight: 600; }
  .annual-row .s.muted { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }
  .placeholder { text-align: center; color: var(--text-secondary); padding: 40px 16px; }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="placeholder" id="placeholder">Загружаю данные…</div>
  </div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function money(n) {
    if (n === null || n === undefined) return "—";
    var sign = n < 0 ? "-" : "";
    return sign + Math.round(Math.abs(n)).toLocaleString("ru-RU") + " ₽";
  }

  var CAT_ICONS = {
    "Пенсия": "🏦", "Премии": "🎁", "Доп доход": "💵", "Другие источники": "➕",
    "Коммунальные платежи": "🏠", "Сотовая связь+Интернет": "📶", "Продукты питания": "🛒",
    "Пром.товары": "🧴", "Транспорт": "🚌", "Здоровье + Красота": "💊",
    "Образование": "📚", "Развлечения": "🎬", "Одежда/Обувь": "👗", "Крупные покупки": "🛋️",
    "Дом, сад и огород": "🌱", "Непредвиденные затраты": "⚠️",
    "Инвестиции": "📈", "Отпуск": "✈️"
  };
  var ACCOUNT_ICONS = { "Халва": "💜", "Т-банк": "💛", "Наличные": "💵", "Сбер": "💚", "Мир": "💳" };
  var SERIES = ["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)","var(--series-5)","var(--series-6)"];
  var MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

  function computeFacts(data) {
    var facts = {};
    data.operations.forEach(function (op) {
      facts[op.category] = (facts[op.category] || 0) + op.amount;
    });
    return facts;
  }

  function allExpenseCategories(data) {
    return data.categories.mandatory.concat(data.categories.optional);
  }

  function computeTotals(data, facts) {
    var incomeTotal = 0;
    data.categories.income.forEach(function (c) { incomeTotal += facts[c.name] || 0; });
    var expenseTotal = 0;
    allExpenseCategories(data).forEach(function (c) { expenseTotal += facts[c.name] || 0; });
    var savingsTotal = Math.round(incomeTotal * 0.10 * 100) / 100;
    data.categories.savings.forEach(function (c) { savingsTotal += facts[c.name] || 0; });
    return { incomeTotal: incomeTotal, expenseTotal: expenseTotal, savingsTotal: savingsTotal, net: incomeTotal - expenseTotal - savingsTotal };
  }

  function renderHero(data, totals) {
    return (
      '<div class="card hero">' +
        '<div class="label">' + (data.balance_label || "Баланс") + '</div>' +
        '<div class="value">' + money(data.balance) + '</div>' +
        '<div class="hero-split">' +
          '<div class="item"><div class="lbl">Приход</div><div class="val income">' + money(totals.incomeTotal) + '</div></div>' +
          '<div class="item"><div class="lbl">Расход</div><div class="val expense">' + money(totals.expenseTotal) + '</div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderDonut(data, facts) {
    var cats = allExpenseCategories(data)
      .map(function (c) { return { name: c.name, amount: facts[c.name] || 0 }; })
      .filter(function (c) { return c.amount > 0; })
      .sort(function (a, b) { return b.amount - a.amount; });

    if (!cats.length) {
      return '<div class="card"><h2>По категориям</h2><div class="empty">Пока нет трат в этом месяце</div></div>';
    }

    var top = cats.slice(0, 6);
    var rest = cats.slice(6);
    var restSum = rest.reduce(function (s, c) { return s + c.amount; }, 0);
    var slices = top.map(function (c, i) { return { name: c.name, amount: c.amount, color: SERIES[i] }; });
    if (restSum > 0) slices.push({ name: "Остальное", amount: restSum, color: "var(--series-other)" });

    var total = slices.reduce(function (s, c) { return s + c.amount; }, 0);
    var r = 15.9155;
    var circumference = 2 * Math.PI * r;
    var offset = 0;
    var arcs = slices.map(function (s) {
      var frac = s.amount / total;
      var dash = frac * circumference;
      var circle = '<circle cx="21" cy="21" r="' + r + '" fill="transparent" stroke="' + s.color + '" stroke-width="5" ' +
        'stroke-dasharray="' + dash.toFixed(2) + ' ' + (circumference - dash).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(2) + '" />';
      offset += dash;
      return circle;
    }).join("");

    var legend = slices.map(function (s) {
      var icon = CAT_ICONS[s.name] || "";
      var pct = Math.round((s.amount / total) * 100);
      return (
        '<div class="legend-row">' +
          '<span class="legend-dot" style="background:' + s.color + '"></span>' +
          '<span class="legend-name">' + icon + ' ' + s.name + '</span>' +
          '<span class="legend-pct">' + pct + '%</span>' +
          '<span class="legend-amt">' + money(s.amount) + '</span>' +
        '</div>'
      );
    }).join("");

    return (
      '<div class="card"><h2>По категориям</h2>' +
        '<div class="donut-wrap">' +
          '<svg width="140" height="140" viewBox="0 0 42 42">' + arcs + '</svg>' +
          '<div class="donut-legend">' + legend + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCategoryCards(data, facts) {
    var cats = allExpenseCategories(data)
      .map(function (c) { return { name: c.name, amount: facts[c.name] || 0 }; })
      .filter(function (c) { return c.amount > 0; })
      .sort(function (a, b) { return b.amount - a.amount; });
    if (!cats.length) return "";
    var max = cats[0].amount;
    var cards = cats.map(function (c, i) {
      var color = i < SERIES.length ? SERIES[i] : "var(--series-other)";
      var pct = max ? Math.round((c.amount / max) * 100) : 0;
      return (
        '<div class="cat-card">' +
          '<div class="top"><span class="icon">' + (CAT_ICONS[c.name] || "") + '</span><span class="amt">' + money(c.amount) + '</span></div>' +
          '<div class="name">' + c.name + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '</div>'
      );
    }).join("");
    return '<div class="card"><h2>Категории целиком</h2><div class="cat-grid">' + cards + '</div></div>';
  }

  function renderAccounts(data) {
    var accts = data.accounts || [];
    if (!accts.length) return "";
    var cards = accts.map(function (a) {
      return (
        '<div class="acct-card">' +
          '<div class="icon">' + (ACCOUNT_ICONS[a.name] || "💳") + '</div>' +
          '<div class="amt">' + money(a.amount) + '</div>' +
          '<div class="name">' + a.name + '</div>' +
        '</div>'
      );
    }).join("");
    return '<div class="card"><h2>По картам и счетам</h2><div class="acct-row">' + cards + '</div></div>';
  }

  function renderOps(data) {
    if (!data.operations.length) return '<div class="card"><h2>Операции</h2><div class="empty">Пока нет записей</div></div>';
    var sorted = data.operations.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var rows = sorted.map(function (op) {
      var isIncome = op.type === "income";
      var amtClass = isIncome ? "ops-amt income" : "ops-amt";
      var amtText = (isIncome ? "+" : "-") + money(op.amount);
      var dateShort = op.date.slice(8, 10) + "." + op.date.slice(5, 7);
      var noteLine = [op.note, op.account].filter(Boolean).join(" · ");
      var color = isIncome ? "var(--good)" : "var(--series-other)";
      return (
        '<div class="ops-row">' +
          '<span class="ops-dot" style="background:' + color + '"></span>' +
          '<span class="ops-date">' + dateShort + '</span>' +
          '<span class="ops-cat">' + (CAT_ICONS[op.category] || "") + ' ' + op.category + (noteLine ? '<div class="ops-note">' + noteLine + '</div>' : '') + '</span>' +
          '<span class="' + amtClass + '">' + amtText + '</span>' +
        '</div>'
      );
    }).join("");
    return '<div class="card"><h2>Операции</h2>' + rows + '</div>';
  }

  function renderAnnual(data, totals) {
    var report = data.annual_report || { current_month_index: new Date().getMonth(), archive: [] };
    var archiveByIndex = {};
    (report.archive || []).forEach(function (m) { archiveByIndex[m.index] = m; });
    var rows = [];
    for (var i = 0; i < 12; i++) {
      var label = MONTH_NAMES[i];
      var income, expense, isCurrent = (i === report.current_month_index);
      if (isCurrent) { income = totals.incomeTotal; expense = totals.expenseTotal; }
      else if (archiveByIndex[i]) { income = archiveByIndex[i].income; expense = archiveByIndex[i].expense; }
      else { rows.push('<div class="annual-row"><span class="m">' + label + '</span><span class="s muted">—</span></div>'); continue; }
      var saldo = income - expense;
      rows.push(
        '<div class="annual-row"><span class="m">' + label + (isCurrent ? " (тек.)" : "") + '</span>' +
        '<span class="s ' + (saldo >= 0 ? "good" : "bad") + '">' + money(saldo) + '</span></div>'
      );
    }
    return '<div class="card"><h2>Годовой отчёт</h2>' + rows.join("") + '</div>';
  }

  function render(data) {
    var facts = computeFacts(data);
    var totals = computeTotals(data, facts);
    var app = document.getElementById("app");
    app.innerHTML =
      '<h1 style="font-size:18px;margin:4px 0 14px;">' + data.month_label + '</h1>' +
      renderHero(data, totals) +
      renderDonut(data, facts) +
      renderCategoryCards(data, facts) +
      renderAccounts(data) +
      renderOps(data) +
      renderAnnual(data, totals) +
      '<div class="empty">Обновлено: ' + new Date(data.updated_at).toLocaleString("ru-RU", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) + '</div>';
  }

  function showError() {
    document.getElementById("app").innerHTML = '<div class="placeholder">Не получилось загрузить данные.<br>Открой чуть позже.</div>';
  }

  fetch("data.json?v=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
    .then(render)
    .catch(showError);
})();
</script>
</body>
</html>
